<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>监控日报与周报</title>
<style>body{font:15px system-ui,sans-serif;line-height:1.6;background:#f5f7fb;color:#14243b;margin:0;padding:28px}main{max-width:1050px;margin:auto}h1{font-size:26px;margin:0}small{color:#556477}section{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:22px;margin:20px 0}button,input,select{font:inherit;padding:8px 12px;border:1px solid #c9d4e2;border-radius:7px;margin:4px}button{cursor:pointer;background:#eaf0fb;color:#173b72}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:16px;max-height:500px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e6eaf0;padding:9px}#message{color:#943412}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}a{color:#174da4}</style>
<main><h1>发送与记录</h1><p>请先保存上方配置，再发送报告。发送状态 accepted 表示 Komari 接受请求，实际送达请在通知渠道确认。</p>
<section><h2>生成与发送</h2>
<div class="row"><button id="sendToday" type="button" aria-describedby="todayHint" style="background:#173b72;color:#fff">发送今日日报</button><small id="todayHint">按报告时区统计今天 00:00 至当前时间，点击即可发送。</small></div>
<div class="row"><label>类型 <select id="kind"><option value="daily">日报</option><option value="weekly">周报</option></select></label><label>历史日期 <input id="date" type="date"></label><button id="preview">预览</button><button id="send">手动发送</button><button id="test">测试通知</button><button id="backup">下载备份</button><button id="refresh">刷新状态</button></div><small>历史日报统计所选自然日；周报统计所选日期所在的周一至下周一。历史日期只能选择已经结束的周期。</small><p id="message" role="status"></p><pre id="previewText">预览内容将在这里显示。</pre></section>
<section><h2>插件运行状态</h2><pre id="status">正在读取…</pre></section><section><h2>最近发送记录</h2><div style="overflow:auto"><table><thead><tr><th>周期</th><th>类型</th><th>状态</th><th>分页状态</th><th>操作</th></tr></thead><tbody id="records"></tbody></table></div></section></main>
<script>
const BASE='/api/plugins/komari-daily-weekly-reports';const el=id=>document.getElementById(id);const date=new Date(Date.now()-86400000);el('date').value=date.toISOString().slice(0,10);
async function request(path,body){const headers=body?{'Content-Type':'application/json'}:{};if(body){const status=await request('/status');if(typeof status.csrfToken!=='string')throw Error('请求校验失败，请刷新插件配置后重试');headers['X-Komari-Reports-CSRF']=status.csrfToken;}const r=await fetch(BASE+path,{credentials:'same-origin',headers,method:body?'POST':'GET',body:body?JSON.stringify(body):undefined});let j;try{j=await r.json();}catch{j={};}if(!r.ok)throw Error(j.error||(r.status===404?'插件尚未启用或正在重新加载，请启用后刷新状态':'请求失败'));return j;}
async function refresh(){try{const s=await request('/status');el('status').textContent=JSON.stringify({版本:s.version,忙碌:s.busy,最后检查:s.lastTick?new Date(s.lastTick).toLocaleString():null,最后生成:s.lastGenerated?new Date(s.lastGenerated).toLocaleString():null,最后接受:s.lastAccepted?new Date(s.lastAccepted).toLocaleString():null,最后错误:s.lastError,状态说明:s.notificationSemantics,最近日志:s.logs.slice(-8)},null,2);const tbody=el('records');tbody.replaceChildren();for(const r of s.records){const tr=document.createElement('tr');for(const text of [r.kind==='daily'?r.period.startDate:r.period.startDate+' → '+r.period.endDate,r.kind,r.status,r.parts.map(p=>p.state+'('+p.attempts+')').join(', ')]){const td=document.createElement('td');td.textContent=text;tr.append(td);}const td=document.createElement('td'),b=document.createElement('button');b.textContent='重试未完成分页';b.disabled=r.status==='accepted';b.onclick=()=>{const uncertain=r.parts.some(p=>['unknown','sending'].includes(p.state));if(uncertain&&!confirm('发送结果未知。请先在 Telegram 核实；继续可能重复发送。确认继续？'))return;job({action:'retry',id:r.id,confirmDuplicateRisk:uncertain});};td.append(b);tr.append(td);tbody.append(tr);}}catch(e){el('message').textContent=e.message;}}
async function job(body){const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);el('message').textContent='处理中…';try{const {id}=await request('/action',body);let done=false;for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,1000));const j=await request('/jobs?id='+encodeURIComponent(id));if(j.status==='failed')throw Error(j.error);if(j.status==='completed'){el('previewText').textContent=j.result.parts?.[0]?.text?j.result.parts.map(p=>p.text).join('\n\n'):j.result.parts?.length&&typeof j.result.parts[0]==='string'?j.result.parts.join('\n\n'):JSON.stringify(j.result,null,2);el('message').textContent='操作已完成；发送操作请在实际通知渠道确认。';done=true;break;}}if(!done)throw Error('任务仍在后台执行，请稍后刷新状态。');}catch(e){el('message').textContent=e.message;}finally{buttons.forEach(b=>b.disabled=false);await refresh();}}
el('sendToday').onclick=()=>job({action:'sendToday'});for(const action of ['preview','send','test'])el(action).onclick=()=>job({action,kind:el('kind').value,date:el('date').value});el('refresh').onclick=refresh;el('backup').onclick=()=>{location.href=BASE+'/export';};refresh();
</script></html>
