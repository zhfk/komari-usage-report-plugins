name: Test, package and release
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'examples/**', 'package*.json', 'komari-plugin.json', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'pages/**', 'examples/**', 'package*.json', 'komari-plugin.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify embedded configuration and same-day delivery in Chromium
        run: python tests/browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configuration-ui-browser
          path: artifacts/browser/
          if-no-files-found: ignore
      - name: Publish versioned release with installable ZIP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no published asset is overwritten."
            exit 0
          fi
          release_args=(--target "$GITHUB_SHA" --title "Komari Daily & Weekly Reports $tag" --notes-file docs/release-notes.md)
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "$tag" artifacts/*.zip artifacts/SHA256SUMS "${release_args[@]}"
